services:
  db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: komanook
      POSTGRES_USER: komanook
      POSTGRES_PASSWORD: local-komanook-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komanook -d komanook"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
